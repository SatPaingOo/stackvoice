# StackVoice — server & management settings.
# See CONFIGURATION.md §2 for the full reference.

server:
  host: 127.0.0.1          # default localhost; use 0.0.0.0 behind a tunnel/proxy
  port: 8765
  log_level: info          # debug | info | warn | error

auth:
  # none  — localhost development only (default)
  # token — one shared bearer token, enough for a private tunnel
  # oauth — OAuth 2.1 with PKCE, which Alexa+ requires
  mode: none
  token: ""                # shared token in "token" mode; consent secret in "oauth" mode
  public_url: ""           # required in "oauth" mode, e.g. https://stackvoice.example.com

simulator:
  enabled: true            # serves the simulated Alexa+ page at /simulator

management:
  cli: true                # CLI face enabled (primary)

cache:
  ttl_seconds: 300         # per-URL cache for fetched JSON / API calls
