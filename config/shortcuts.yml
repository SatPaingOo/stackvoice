# StackVoice shortcuts — one tool that runs several.
# Edit here or in the web console at /console.

shortcuts:
  - name: "morning brief"          # becomes the tool morning_brief
    description: "The latest from your library plus whether the stack is healthy."
    enabled: true
    steps:
      - tool: library_search
        args: {"limit":2}
      - tool: stack_status
        args: {}
    reply: "Here is your brief. {1} {2}"
  - name: "market check"          # becomes the tool market_check
    description: "How the markets feed is doing and what it just picked up."
    enabled: true
    steps:
      - tool: markets_status
        args: {}
      - tool: markets_search
        args: {"limit":2}
    reply: "Markets check. {1} {2}"
